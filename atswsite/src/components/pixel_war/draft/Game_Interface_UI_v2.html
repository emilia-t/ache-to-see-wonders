  var canvases = Array.from(document.querySelectorAll(
    '[data-mb-type="rResCanvas"][data-mb-route]'
  ))
  if (!canvases.length) return
  function syncPages() {
    document.querySelectorAll('main.mb-page').forEach(function (page) {
      var routes = Array.from(page.querySelectorAll(
        '[data-mb-type="rResCanvas"][data-mb-route]'
      ))
      if (routes.length) page.hidden = routes.every(function (canvas) { return canvas.hidden })
    })
  }
  function show(route) {
    var target = canvases.find(function (canvas) {
      return canvas.dataset.mbRoute === route
    }) || canvases[0]
    canvases.forEach(function (canvas) { canvas.hidden = canvas !== target })
    syncPages()
    var links = Array.from(document.querySelectorAll('.mb-page-directory-link'))
    var activeIndex = 0
    links.forEach(function (link, index) {
      var active = link.dataset.mbRoute === target.dataset.mbRoute
      if (active) activeIndex = index
      link.classList.toggle('mb-active', active)
      if (active) link.setAttribute('aria-current', 'page')
      else link.removeAttribute('aria-current')
    })
    var current = document.querySelector('.mb-page-directory-current')
    if (current) current.textContent = String(activeIndex + 1)
  }
  function navigate(route) {
    if (route && location.hash !== route) {
      var url = new URL(document.URL)
      url.hash = route.slice(1)
      history.replaceState(history.state, '', url.toString())
    }
    show(route)
  }
  window.addEventListener('hashchange', function () { show(location.hash) })
  document.addEventListener('click', function (event) {
    var link = event.target.closest && event.target.closest('.mb-page-directory-link')
    if (!link) return
    event.preventDefault()
    navigate(link.dataset.mbRoute || link.getAttribute('href') || '')
  })
  show(location.hash)
})()
